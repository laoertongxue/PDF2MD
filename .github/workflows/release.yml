name: Release Desktop App

on:
  push:
    tags:
      - "v*"

jobs:
  macos-apple-silicon:
    name: Build macOS Apple Silicon release assets
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-name: ${{ steps.metadata.outputs.artifact-name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: parsing-core-app/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          python-version: "3.12.13"

      - name: Install pinned Python
        run: |
          uv python install 3.12.13
          python_bin="$(printf '%s\n' "$(uv python dir)"/cpython-3.12.13-*/bin/python3)"
          test -x "$python_bin"
          printf '%s\n' "$(dirname "$python_bin")" >> "$GITHUB_PATH"
          "$python_bin" --version

      - name: Restore locked Python environment
        run: uv sync --frozen --all-extras

      - name: Validate release tag and resolve version
        id: version
        shell: bash
        run: |
          version="$(python scripts/release_version.py --github-ref-name "$GITHUB_REF_NAME")"
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Resolve auditable artifact name
        id: metadata
        run: printf 'artifact-name=pdf2md-v%s-run-%s\n' "$VERSION" "${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Require native Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64" || {
            echo "release requires the arm64 macos-15 runner" >&2
            exit 1
          }

      - name: Build Apple Vision OCR helper
        run: ./parsing-core-app/scripts/build-vision-ocr.sh

      - name: Run repository quality and security gates
        run: |
          ./scripts/verify-fast.sh
          ./scripts/verify-architecture.sh
          PDF2MD_NPM_BIN="$(command -v npm)" \
            PDF2MD_UV_BIN="$(command -v uv)" \
            ./scripts/verify-security.sh

      - name: Reclaim Rust test artifacts
        working-directory: parsing-core-app/src-tauri
        run: cargo clean

      - name: Prefetch locked Python wheels
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          python_path="$(/usr/bin/python3 -I -S -B -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$(command -v python3)")"
          uv_path="$(/usr/bin/python3 -I -S -B -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$(command -v uv)")"
          PDF2MD_WHEELHOUSE_ROOT="$RUNNER_TEMP/pdf2md-wheelhouse"
          /usr/bin/env -i \
            HOME="$HOME" \
            PATH="/usr/bin:/bin" \
            TMPDIR="$RUNNER_TEMP" \
            /usr/bin/python3 -I -S -B \
              ./parsing-core-app/scripts/sidecar_runtime.py prefetch-wheelhouse \
              --repo "$GITHUB_WORKSPACE" \
              --python-path "$python_path" \
              --python-version "3.12.13" \
              --uv-path "$uv_path" \
              --uv-version "0.12.3" \
              --wheelhouse-root "$PDF2MD_WHEELHOUSE_ROOT"
          printf 'PDF2MD_WHEELHOUSE_ROOT=%s\n' "$PDF2MD_WHEELHOUSE_ROOT" >> "$GITHUB_ENV"
          printf 'PDF2MD_UV_BIN=%s\n' "$uv_path" >> "$GITHUB_ENV"

      - name: Prepare embedded Python runtime
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          /usr/bin/env -i \
            HOME="$HOME" \
            PATH="/usr/bin:/bin" \
            PDF2MD_UV_BIN="$PDF2MD_UV_BIN" \
            PDF2MD_WHEELHOUSE_ROOT="$PDF2MD_WHEELHOUSE_ROOT" \
            TMPDIR="$RUNNER_TEMP" \
            /bin/bash -p --noprofile --norc ./parsing-core-app/scripts/prepare-sidecar-python.sh

      - name: Build desktop app natively
        working-directory: parsing-core-app
        run: npm run tauri -- build -- --locked

      - name: Verify and stage release assets
        shell: bash
        run: |
          bundle="parsing-core-app/src-tauri/target/release/bundle"
          app="$bundle/macos/PDF2MD.app"
          dmg="$bundle/dmg/PDF2MD_${VERSION}_aarch64.dmg"
          test -d "$app"
          test -f "$dmg"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          app_executables=("$app/Contents/MacOS/parsing-core-app")
          test "${#app_executables[@]}" -eq 1
          file "${app_executables[0]}" | grep -q 'arm64'
          file "$app/Contents/Resources/python-runtime/bin/python3.12" | grep -q 'arm64'
          ./scripts/check-release-sidecar.sh "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          ./scripts/test-release-sidecar.sh "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          PDF2MD_APP_PATH="$app" uv run --frozen pytest -q tests/test_version_consistency.py

          ./scripts/verify-release-dmg.sh "$dmg" "$VERSION"

          PDF2MD_RUN_REAL_ARTIFACT_TESTS=1 \
            PDF2MD_REAL_APP_PATH="$app" \
            PDF2MD_REAL_DMG_PATH="$dmg" \
            PDF2MD_REAL_VERSION="$VERSION" \
            uv run --frozen pytest -q tests/test_release_supply_chain.py \
              -k test_packaged_pdf2md_artifacts_pass_production_release_gates

          mkdir release-assets
          app_zip="release-assets/PDF2MD_${VERSION}_aarch64.app.zip"
          dmg_copy="release-assets/$(basename "$dmg")"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$app_zip"
          cp "$dmg" "$dmg_copy"
          (cd release-assets && shasum -a 256 "$(basename "$app_zip")" > "$(basename "$app_zip").sha256")
          (cd release-assets && shasum -a 256 "$(basename "$dmg_copy")" > "$(basename "$dmg_copy").sha256")

      - name: Attest release asset provenance
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/PDF2MD_${{ steps.version.outputs.version }}_aarch64.dmg
            release-assets/PDF2MD_${{ steps.version.outputs.version }}_aarch64.dmg.sha256
            release-assets/PDF2MD_${{ steps.version.outputs.version }}_aarch64.app.zip
            release-assets/PDF2MD_${{ steps.version.outputs.version }}_aarch64.app.zip.sha256

      - name: Stage Sigstore attestation bundle
        run: cp "${{ steps.attestation.outputs.bundle-path }}" "release-assets/PDF2MD_${VERSION}_sigstore.jsonl"

      - name: Upload release assets to this workflow run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact-name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish GitHub Release from workflow artifact
    needs: macos-apple-silicon
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download assets from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.macos-apple-silicon.outputs.artifact-name }}
          path: release-assets

      - name: Verify downloaded asset set
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.macos-apple-silicon.outputs.version }}
        run: |
          test -f "release-assets/PDF2MD_${VERSION}_aarch64.dmg"
          test -f "release-assets/PDF2MD_${VERSION}_aarch64.dmg.sha256"
          test -f "release-assets/PDF2MD_${VERSION}_aarch64.app.zip"
          test -f "release-assets/PDF2MD_${VERSION}_aarch64.app.zip.sha256"
          test -f "release-assets/PDF2MD_${VERSION}_sigstore.jsonl"
          jq -e '
            type == "object" and
            has("mediaType") and
            has("verificationMaterial") and
            has("dsseEnvelope")
          ' "release-assets/PDF2MD_${VERSION}_sigstore.jsonl" >/dev/null
          (cd release-assets && sha256sum --check *.sha256)
          bundle="release-assets/PDF2MD_${VERSION}_sigstore.jsonl"
          subjects=(
            "release-assets/PDF2MD_${VERSION}_aarch64.dmg"
            "release-assets/PDF2MD_${VERSION}_aarch64.dmg.sha256"
            "release-assets/PDF2MD_${VERSION}_aarch64.app.zip"
            "release-assets/PDF2MD_${VERSION}_aarch64.app.zip.sha256"
          )
          for subject in "${subjects[@]}"; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" --bundle "$bundle"
          done

      - name: Create GitHub Release from verified CI assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          body_path: docs/releases/${{ needs.macos-apple-silicon.outputs.version }}.md
          generate_release_notes: true
