name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository quality and security gates
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: parsing-core-app/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          python-version: "3.12.13"

      - name: Install pinned Python
        run: |
          uv python install 3.12.13
          python_bin="$(printf '%s\n' "$(uv python dir)"/cpython-3.12.13-*/bin/python3)"
          test -x "$python_bin"
          printf '%s\n' "$(dirname "$python_bin")" >> "$GITHUB_PATH"
          "$python_bin" --version

      - name: Restore locked Python environment
        run: uv sync --frozen --all-extras

      - name: Prefetch locked Python wheels
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          python_path="$(/usr/bin/python3 -I -S -B -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$(command -v python3)")"
          uv_path="$(/usr/bin/python3 -I -S -B -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$(command -v uv)")"
          PDF2MD_WHEELHOUSE_ROOT="$RUNNER_TEMP/pdf2md-wheelhouse"
          /usr/bin/env -i \
            HOME="$HOME" \
            PATH="/usr/bin:/bin" \
            TMPDIR="$RUNNER_TEMP" \
            /usr/bin/python3 -I -S -B \
              ./parsing-core-app/scripts/sidecar_runtime.py prefetch-wheelhouse \
              --repo "$GITHUB_WORKSPACE" \
              --python-path "$python_path" \
              --python-version "3.12.13" \
              --uv-path "$uv_path" \
              --uv-version "0.12.3" \
              --wheelhouse-root "$PDF2MD_WHEELHOUSE_ROOT"
          printf 'PDF2MD_WHEELHOUSE_ROOT=%s\n' "$PDF2MD_WHEELHOUSE_ROOT" >> "$GITHUB_ENV"
          printf 'PDF2MD_UV_BIN=%s\n' "$uv_path" >> "$GITHUB_ENV"

      - name: Prepare embedded Python runtime
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          /usr/bin/env -i \
            HOME="$HOME" \
            PATH="/usr/bin:/bin" \
            PDF2MD_UV_BIN="$PDF2MD_UV_BIN" \
            PDF2MD_WHEELHOUSE_ROOT="$PDF2MD_WHEELHOUSE_ROOT" \
            TMPDIR="$RUNNER_TEMP" \
            /bin/bash --noprofile --norc -p ./parsing-core-app/scripts/prepare-sidecar-python.sh

      - name: Build Apple Vision OCR helper
        run: ./parsing-core-app/scripts/build-vision-ocr.sh

      - name: Run repository quality gates
        run: ./scripts/verify-fast.sh

      - name: Run architecture gates
        run: ./scripts/verify-architecture.sh

      - name: Run security gates
        run: PDF2MD_NPM_BIN="$(command -v npm)" PDF2MD_UV_BIN="$(command -v uv)" ./scripts/verify-security.sh
